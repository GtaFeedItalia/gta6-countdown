<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA VI Countdown</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:#070b1a;
color:white;
position:relative;
}

.bg{
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%,#ff0080 0%,transparent 25%),
radial-gradient(circle at 80% 30%,#8a2be2 0%,transparent 30%),
radial-gradient(circle at 50% 80%,#00bfff 0%,transparent 35%),
#050816;
animation:pulse 8s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.1);}
}

.container{
position:relative;
z-index:10;
text-align:center;
padding:25px;
width:90%;
max-width:900px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.15);
border-radius:30px;
box-shadow:0 0 40px rgba(255,0,255,.25);
}

.logo{
font-size:4rem;
font-weight:900;
letter-spacing:4px;
text-shadow:
0 0 10px #ff4fd8,
0 0 25px #ff4fd8,
0 0 50px #ff4fd8;
}

.subtitle{
margin-top:10px;
font-size:1.2rem;
color:#ddd;
letter-spacing:3px;
}

.countdown{
display:flex;
justify-content:center;
gap:20px;
margin-top:50px;
flex-wrap:wrap;
}

.box{
min-width:140px;
padding:20px;
background:rgba(255,255,255,.08);
border-radius:20px;
box-shadow:0 0 20px rgba(255,255,255,.1);
}

.number{
font-size:4rem;
font-weight:bold;
color:#fff;
text-shadow:
0 0 10px #c084fc,
0 0 20px #c084fc,
0 0 40px #c084fc;
}

.label{
margin-top:10px;
font-size:1rem;
letter-spacing:2px;
color:#ccc;
}

.footer{
margin-top:40px;
font-size:1.2rem;
letter-spacing:3px;
color:#fff;
opacity:.9;
}

.live{
margin-top:20px;
font-size:1.3rem;
font-weight:bold;
color:#ff3b3b;
animation:blink 1s infinite;
}

@keyframes blink{
50%{
opacity:.3;
}
}

.particle{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
opacity:.7;
animation:float linear infinite;
}

@keyframes float{
from{
transform:translateY(100vh);
}
to{
transform:translateY(-100px);
}
}

@media(max-width:768px){

.logo{
font-size:2.5rem;
}

.number{
font-size:2.4rem;
}

.box{
min-width:100px;
}
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

<div class="logo">GTA VI</div>

<div class="subtitle">
COUNTDOWN UFFICIALE GTA FEED ITALIA
</div>

<div class="countdown">

<div class="box">
<div id="days" class="number">0</div>
<div class="label">GIORNI</div>
</div>

<div class="box">
<div id="hours" class="number">0</div>
<div class="label">ORE</div>
</div>

<div class="box">
<div id="minutes" class="number">0</div>
<div class="label">MINUTI</div>
</div>

<div class="box">
<div id="seconds" class="number">0</div>
<div class="label">SECONDI</div>
</div>

</div>

<div class="footer">
GRAND THEFT AUTO VI
</div>

<div class="live">
🔴 LIVE 24/7
</div>

</div>

<script>

// DATA USCITA
const targetDate = new Date("November 19, 2026 00:00:00").getTime();

function updateCountdown(){

const now = new Date().getTime();
const distance = targetDate - now;

const days = Math.floor(distance/(1000*60*60*24));
const hours = Math.floor((distance%(1000*60*60*24))/(1000*60*60));
const minutes = Math.floor((distance%(1000*60*60))/(1000*60));
const seconds = Math.floor((distance%(1000*60))/1000);

document.getElementById("days").innerText = days;
document.getElementById("hours").innerText = hours;
document.getElementById("minutes").innerText = minutes;
document.getElementById("seconds").innerText = seconds;

}

setInterval(updateCountdown,1000);
updateCountdown();

// PARTICELLE

for(let i=0;i<70;i++){

let p=document.createElement("div");
p.classList.add("particle");

p.style.left=Math.random()*100+"%";
p.style.animationDuration=(5+Math.random()*15)+"s";
p.style.opacity=Math.random();

document.body.appendChild(p);

}
</script>

</body>
</html>
